# Initial configuration, declared ex ante.
# Every change to these values is logged in odd/tasks/thematic-redundancy-system.md.

# Locations relative to the project root.
paths:
  data_dir: data
  results_dir: results
  tessdata_dir: tessdata

# Public DSpace repository and the faculty community that holds the programs. The metadata
# harvest asks for page_size items per page, starts requests at least
# request_interval_seconds apart, and retries a failed request up to max_retries times.
repository:
  base_url: "https://repositorio.ucsm.edu.pe"
  faculty_community_uuid: "3e706f8d-cba0-4d4a-8d51-dd317c3e7652"
  page_size: 100
  request_interval_seconds: 1.0
  max_retries: 3

# Corpus filter: dc.date.issued range, renati.type, and program collections. Each program
# is one DSpace collection of the faculty community (uuids resolved on 2026-10-02).
snapshot:
  year_start: 2021
  year_end: 2026
  thesis_type: tesis
  programs:
    - key: sistemas
      name: "Ingeniería de Sistemas"
      collection_uuid: "695b14ab-e5b2-49b5-9edf-f709e883b73b"
    - key: industrial
      name: "Ingeniería Industrial"
      collection_uuid: "f0217548-ce48-4bae-b163-21b5e2504ef6"
    - key: electronica
      name: "Ingeniería Electrónica"
      collection_uuid: "a8bdd7c0-f1aa-4797-b04e-112e27f60da3"
    - key: mecanica
      name: "Ingeniería Mecánica, Mecánica-Eléctrica y Mecatrónica"
      collection_uuid: "cf0ca97e-9b81-484d-a325-611b8a8d8223"
    - key: minas
      name: "Ingeniería de Minas"
      collection_uuid: "9d9ecbe5-56c5-4cdf-81a3-b9a3736a47b3"

# Tesseract languages and rasterization resolution for pages without a text layer.
ocr:
  languages: spa+eng
  dpi: 300

# PDF text extraction. A page whose text layer has fewer than min_text_chars characters,
# stripped, is low-text. Only the low-text pages among the first ocr_window_pages pages of a
# document are OCR'd (D25). A running header or footer is a line among the first or last
# edge_lines non-empty lines of a page that repeats on at least min_share of the pages with
# text, in a document with at least min_pages such pages.
extraction:
  min_text_chars: 50
  ocr_window_pages: 100
  header_footer:
    edge_lines: 3
    min_share: 0.3
    min_pages: 5

# Objectives locator (T10). The general objective is cut at general_max_chars characters and
# the specific objectives at specific_max_chars, both then flagged as too long; a general
# objective under min_chars characters is flagged as too short. The manual verification
# sample (O05) draws per_program theses of each program with seed, and its workbook goes to
# workbook_dir/<snapshot_id>/, which must lie inside paths.data_dir (gitignored).
objectives:
  general_max_chars: 1200
  specific_max_chars: 4000
  min_chars: 40
  verification_sample:
    per_program: 12
    seed: 20261007
    workbook_dir: data/labels/objectives_check

# Fichas dataset (T12). wrong_pdfs lists the theses whose PDF on disk is a copy of another
# item's PDF (found in T05); their PDF text is not used. expected holds the counts that the
# build of snapshot_id must reach, or it stops; another snapshot needs its own counts.
fichas:
  wrong_pdfs:
    - item_handle: "20.500.12920/11777"
      pdf_of_handle: "20.500.12920/11776"
  expected:
    snapshot_id: "20261002T224412Z"
    records: 766
    included: 744
    duplicates: 2
    non_thesis: 20
    objectives_extracted: 728
    metadata_only: 16

# Token budget per chunk, special tokens included, under both tokenizers. expected holds the
# counts that the chunk build of snapshot_id must reach (T13, D27), or it stops; another
# snapshot needs its own counts.
chunking:
  max_tokens: 128
  expected:
    snapshot_id: "20261002T224412Z"
    documents: 744
    chunks: 5217
    title_chunks: 744
    body_chunks: 4473

# Embedding models (T14), loaded from the local Hugging Face cache only. Each encodes
# batch_size chunks at a time on device, with threads CPU threads; its raw chunk vectors are
# cached under data/cache/chunk_vectors/. document_vector is the document vector that later
# steps read: section_mean, the equal-weight mean of the section vectors (D09), or plain_mean,
# the mean of all the chunk vectors (the sensitivity variant). The build counts the theses
# whose two vectors have a cosine below sensitivity_cosine_threshold. expected holds the counts
# that the embeddings of snapshot_id must reach, per model, or the build stops.
embedding:
  models:
    - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    - sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  batch_size: 64
  device: cpu
  threads: 10
  document_vector: section_mean
  sensitivity_cosine_threshold: 0.95
  expected:
    snapshot_id: "20261002T224412Z"
    documents: 744
    chunks: 5217

# TF-IDF baseline (T15, D28). The full-clean lemmas of each section (D10, D26) are vectorized
# as unigrams and, when max_ngram is 2, the bigrams inside each section. A term must occur in
# at least min_df theses and in at most a max_df share of them (1.0 turns the cap off), and
# sublinear_tf takes 1 + log of its count. document_vector is the matrix that later steps
# read: section_mean, the equal-weight mean of the section vectors (as D09), or concatenated,
# one vector over all the sections. The build counts the theses whose two vectors have a cosine
# below sensitivity_cosine_threshold, and reports their minimum and median. expected holds the
# counts that the build of snapshot_id must reach, or it stops.
tfidf:
  max_ngram: 2
  min_df: 2
  max_df: 1.0
  sublinear_tf: true
  document_vector: section_mean
  sensitivity_cosine_threshold: 0.95
  expected:
    snapshot_id: "20261002T224412Z"
    documents: 744
    sections: 2216
    terms: 14308
    nonzeros: 98282

umap:
  n_neighbors: 15
  n_components: 5
  min_dist: 0.0
  metric: cosine

# K sweep from k_start to k_stop (inclusive) in steps of k_step.
kmeans:
  k_start: 8
  k_stop: 50
  k_step: 2

# min_samples keeps the HDBSCAN default.
hdbscan:
  min_cluster_sizes: [5, 10, 15, 20]

seeds: [7, 13, 21, 42, 73]

# Experiment declaration (T18, D30), fixed on 2026-10-19 before any run. It reuses, without
# repeating them, the umap, kmeans (the K sweep), hdbscan (the size grid) and seeds blocks,
# embedding.models and the document_vector of embedding and tfidf (section_mean for both);
# tests/unit/test_experiment_declaration.py pins all of them together, and a change needs a new
# decision in the plan. The semantic runs cluster the UMAP output (clustering_space), one fit per
# (model, seed) with random_state = seed, shared by K-means and HDBSCAN. kmeans and hdbscan hold
# the arguments that the sweep and the grid do not: min_samples null keeps hdbscan's default,
# min_cluster_size. The TF-IDF baseline is K-means on its sparse L2 matrix, with a matched-K run
# for the NPMI comparison. K and min_cluster_size are chosen on seed means; the noise cap of the
# min_cluster_size choice is selection.gates.max_mean_noise_fraction. NPMI scores the top_n
# c-TF-IDF terms with each thesis as one document whose segments are its sections, and windows
# as the sensitivity setting; an absent term stops the run. The ARI noise handling feeds the
# stability gate, and its sensitivity is only reported. "A beats B" when the difference of the
# seed means exceeds the larger seed SD; the labeled-set F1 is compared by a paired bootstrap.
experiment:
  clustering_space: umap
  kmeans:
    n_init: 10
    init: k-means++
  hdbscan:
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom
  baseline:
    representation: tfidf
    algorithm: kmeans
    space: sparse_l2
    matched_k: true
  k_choice: max_seed_mean_silhouette
  mcs_choice: max_seed_mean_silhouette_under_noise_cap
  ctfidf:
    vocabulary: tfidf_terms
    counts: raw_within_section
    weighting: bertopic_0.17.4_defaults
    include_noise_class: true
    tie_order: term_ascending
  npmi:
    top_n: 10
    unit: document
    window_size: null
    reference: thesis_sections
    sensitivity:
      unit: window
      window_size: 10
    absent_terms: error
  ari:
    noise_handling: own_label
    sensitivity: exclude_either
  selection:
    gates:
      min_mean_ari: 0.65
      max_mean_noise_fraction: 0.30
    seeded_tie_tolerance: max_seed_sd
    f1:
      bootstrap_resamples: 2000
      bootstrap_seed: 7
      interval: 0.95
    fallbacks:
      algorithm: kmeans
      model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    representative_run: max_mean_ari_to_others
  acceptance:
    stability_max_cv: 0.10

# Topic map (T16): the 2-D projection of the original document vectors, for the visualization
# map only; no metric, choice or selection reads it, so it is outside the experiment
# declaration and its pin. method umap is a UMAP fit of its own, with n_components 2 and the
# run's seed as random_state ("a separate 2D map for visualization" in the plan's initial
# configuration); pca is the alternative that thesis plan section 3.6.3 names for
# visualization, and it ignores the other three keys. The method and the three UMAP values
# wait for the user's confirmation (plan T16).
topic_map:
  projection:
    method: umap
    n_neighbors: 15
    min_dist: 0.0
    metric: cosine

# Direct redundancy (T22, D13, D15). cv_folds is the k of the cross-validation that chooses
# tau. known_duplicates lists pairs of included theses known to be one thesis deposited twice
# (O09, user decision 2026-10-19): they stay in the labeled pairs and the search, and the
# results flag them, in either order.
redundancy:
  cv_folds: 5
  known_duplicates:
    - [DOC-1b29cde4, DOC-b2303c69]

recommender:
  top_k: 5
  mmr_lambda: 0.7
  neighbor_topics: 3
  nearby_gaps: 3

# Gap rules (a) to (d) and their stability filter (T24, D16). The values from
# npmi_floor_quantile on were decided by the user on 2026-10-20 (D32), before any gap rule ran
# on the real map; the rules state their reasons in the plan.
gaps:
  temporal_split_year: 2024
  temporal_min_count: 3
  bridge_max_docs: 1
  nearest_topics: 3
  stability_min_runs: 4
  # (a) The NPMI floor is this quantile of the per-topic NPMI of every seed run of the winner
  # (D30's primary setting); the size cut is the first quartile of the same runs' topic sizes.
  npmi_floor_quantile: 0.25
  # (c) Two programs are affine at this U4 score or above; a topic is present in the source
  # with at least this many theses and this share of the program's theses, and absent from
  # the target at or below rare_max_share.
  min_affinity: 1
  present_min_count: 5
  present_min_share: 0.05
  rare_max_share: 0.0
  # (d) The fall in a topic's share from 2021-2023 to 2024-2026 that counts.
  min_decline: 0.025
  # A gap is present in another run when one of its gaps overlaps it by this Jaccard or more.
  stability_min_overlap: 0.5

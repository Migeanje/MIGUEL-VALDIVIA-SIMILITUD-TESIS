[project]
name = "thematic-redundancy"
version = "0.1.0"
description = "Local prototype for thematic redundancy and research-gap analysis of UCSM engineering theses."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf>=1.28,<2",
    "pdfplumber>=0.11,<0.12",
    "httpx>=0.28,<0.29",
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "pyarrow>=25,<26",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "spacy>=3.8,<3.9",
    "es-core-news-md",
    "sentence-transformers>=6.1,<7",
    "transformers>=5,<6",
    "torch>=2.14,<3",
    "umap-learn>=0.5.12,<0.6",
    "hdbscan>=0.8.44,<0.9",
    "scikit-learn>=1.9,<2",
    "bertopic>=0.17.4,<0.18",
    "gensim>=4.4,<5",
    "scipy>=1.18,<2",
    "pingouin>=0.7,<0.8",
    "statsmodels>=0.15,<0.16",
    "openpyxl>=3.1,<4",
    "streamlit>=1.64,<2",
    "plotly>=7.1,<8",
    "matplotlib>=3.11,<4",
    "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "jupyterlab>=4.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thematic_redundancy"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
